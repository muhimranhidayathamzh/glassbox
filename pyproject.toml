[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox"
version = "0.1.0"
description = "A small LLM built from scratch, with tools to inspect, steer and trace how it thinks."
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]  # zip() over pairs such as zip(ids, ids[1:]) is intentionally uneven

[tool.ruff.lint.per-file-ignores]
"python/glassbox/eval/writeup.py" = ["E501"]  # page and post templates: one paragraph per line
